name: 每日更新妖股雷達

on:
  schedule:
    # GitHub 用 UTC 時間；台灣 15:40 與 17:30（補跑，避免官方資料延遲公布）
    - cron: "40 7 * * 1-5"
    - cron: "30 9 * * 1-5"
  workflow_dispatch:
    inputs:
      force_line:
        description: "LINE 通知：同一交易日已發送過仍再發送"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 保留前一次下載的行情，每天只需補抓當天
      - name: 還原行情快取
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: market-cache-${{ github.run_id }}
          restore-keys: market-cache-

      - name: 篩選並產生網站
        run: python export_site.py

      # 未設定 LINE 金鑰時會自動略過；同一交易日只發送一次
      - name: 傳送明日強勢候選到 LINE
        continue-on-error: true  # LINE 失敗不影響網站更新
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python notify_line.py ${{ inputs.force_line && '--force' || '' }}

      - name: 儲存行情快取
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: market-cache-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

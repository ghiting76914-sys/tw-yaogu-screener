name: 每日更新妖股雷達

on:
  schedule:
    # GitHub 用 UTC 時間。GitHub 排程忙碌時可能延遲或被略過，所以安排多次；
    # 網站更新可重複執行，LINE 同一交易日只發送一次。
    # 台灣時間 13:00（盤中預覽，隔日沖推播）
    - cron: "0 5 * * 1-5"
    # 台灣時間 15:40、16:20、17:10、18:30、20:15（收盤後正式版）
    - cron: "40 7 * * 1-5"
    - cron: "20 8 * * 1-5"
    - cron: "10 9 * * 1-5"
    - cron: "30 10 * * 1-5"
    - cron: "15 12 * * 1-5"
  workflow_dispatch:
    inputs:
      force_line:
        description: "LINE 通知：同一交易日已發送過仍再發送"
        type: boolean
        default: false
      revenue_test:
        description: "LINE 通知：只發送本期營收動能名單（測試用）"
        type: boolean
        default: false
      preview:
        description: "盤中預覽：用證交所即時行情當作今天（13:00 執行，推播隔日沖）"
        type: boolean
        default: false
      skip_line:
        description: "不發送 LINE（測試網站更新用）"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 保留前一次下載的行情，每天只需補抓當天
      - name: 還原行情快取
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: market-cache-${{ github.run_id }}
          restore-keys: market-cache-

      # 雲端快取不足 2 年時，從 Release 下載初始資料；已有的檔案不覆蓋，之後每天只補當天
      - name: 補齊歷史資料
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/cache
          n=$(ls data/cache/twse_*.json 2>/dev/null | wc -l)
          r=$(ls data/cache/rev_*.json 2>/dev/null | wc -l)
          echo "快取中有 $n 個交易日的行情檔、$r 個月營收檔"
          if [ "$n" -lt 500 ] || [ "$r" -lt 60 ]; then
            gh release download data-seed --repo "$GITHUB_REPOSITORY" -p market-cache.tar.gz -D /tmp
            tar -xzf /tmp/market-cache.tar.gz --skip-old-files -C data/cache
            echo "補齊後有 $(ls data/cache/twse_*.json | wc -l) 個交易日的行情檔"
          fi

      - name: 篩選並產生網站
        # 盤中預覽：手動勾選，或 13:00 的排程；若官方收盤資料已公布，仍會使用官方資料
        run: python export_site.py ${{ (inputs.preview || github.event.schedule == '0 5 * * 1-5') && '--preview' || '' }}

      # 未設定 LINE 金鑰時會自動略過；同一交易日只發送一次
      - name: 傳送明日強勢候選到 LINE
        if: ${{ !inputs.skip_line }}
        continue-on-error: true  # LINE 失敗不影響網站更新
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          # all：群發給所有好友（預設）；me：只傳給 LINE_USER_ID。可在 GitHub 的 Variables 設定 LINE_SEND_TO
          LINE_SEND_TO: ${{ vars.LINE_SEND_TO || 'all' }}
          # cron-job.org 用的 GitHub 金鑰到期日；重新產生後請一併更新這裡
          CRON_TOKEN_EXPIRES: "2027-10-03"
        run: python notify_line.py ${{ inputs.force_line && '--force' || '' }} ${{ inputs.revenue_test && '--revenue-test' || '' }}

      - name: 儲存行情快取
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: market-cache-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
